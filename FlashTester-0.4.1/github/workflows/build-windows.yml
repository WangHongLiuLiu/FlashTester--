name: Build FlashTester 0.4.1 Chinese (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release executable
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage executable and notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/flashtester.exe dist/FlashTester_0.4.1_简体中文版.exe
          Copy-Item 汉化版构建说明.txt dist/
          Copy-Item LICENSE dist/ -ErrorAction SilentlyContinue

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: FlashTester-0.4.1-简体中文版-Windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
